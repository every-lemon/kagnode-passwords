[package]
name = "kagnode-passwords-release-candidate"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zeroize = "1"
