[package]
name = "kagnode-vault-keys"
version = "5.0.3"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "KagNode Account delegated vault key service"
[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
ring = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
