name: Source candidate tooling
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Source candidate Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.toolchain }} fmt --manifest-path tools/release/Cargo.toml --check
      - run: cargo +${{ matrix.toolchain }} clippy --manifest-path tools/release/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --manifest-path tools/release/Cargo.toml --locked
      - run: cargo +${{ matrix.toolchain }} run --manifest-path tools/release/Cargo.toml --locked -- inventory .
