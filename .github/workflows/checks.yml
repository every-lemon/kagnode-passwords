name: Validate KagNode Passwords
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Provider proof and vault boundaries
        run: python -m pytest -q tests/test_account_login.py tests/test_provider_login_routes.py
      - run: |
          node --check authentactor/static/app.js
          node --check authentactor/static/controls.js
          node --check authentactor/static/theme.js
          sh -n packaging/build-deb.sh
      - run: playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: interface-checks
          path: |
            test-artifacts/*.png
            test-artifacts/report.json
