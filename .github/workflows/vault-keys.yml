name: Managed vault interoperability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  vault:
    name: Managed vault (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.88.0 fmt --manifest-path key-service/Cargo.toml --check
      - run: cargo +1.88.0 clippy --locked --manifest-path key-service/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.88.0 test --locked --manifest-path key-service/Cargo.toml
      - run: cargo +1.88.0 build --locked --manifest-path key-service/Cargo.toml
      - run: pip install -r requirements-test.txt
      - run: playwright install --with-deps ${{ matrix.engine }}
      - name: Isolated migration, emergency and browser journeys
        run: python -m pytest -q tests/test_vault_keys.py tests/test_vault_keys_native.py tests/test_managed_vault_routes.py tests/test_managed_browser.py
        env:
          TMPDIR: ${{ runner.temp }}
          KAGNODE_VAULT_KEYS_BINARY: ${{ github.workspace }}/key-service/target/debug/kagnode-vault-keys
          KAGNODE_MANAGED_BROWSER: '1'
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
